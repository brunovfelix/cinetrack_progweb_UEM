<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CineTrack</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>CineTrack</h1>
            <input type="search" id="busca" aria-label="Buscar filme">
            <button type="button" id="btn-adicionar">+ Adicionar</button>
        </header>

        <nav aria-label="Filtros de status">
            <button class="ativo" data-status="todos">Todos</button>
            <button data-status="assistido">Assistido</button>
            <button data-status="assistindo">Assistindo</button>
            <button data-status="quero">Quero assistir</button>
        </nav>

        <main>
            <section id="lista" aria-live="polite">
            </section>
        </main>

        <footer>
            <small>CineTrack &copy; 2026 &middot; 0 filmes cadastrados</small>
            <a href="sobre.html">Sobre</a>
        </footer>

        <div id="modal" hidden>
            <div class="modal-conteudo">
                <h2 id="modal-titulo">Adicionar filme</h2>

                <form id="form-filme">
                    <div class="campo">
                        <label for="titulo">Título</label>
                        <input id="titulo" name="titulo" type="text" required>
                    </div>

                    <div class="campo">
                        <label for="ano">Ano</label>
                        <input id="ano" name="ano" type="number" min="1888" max="2030" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <input id="genero" name="genero" type="text" required>
                    </div>

                    <div class="campo">
                        <label for="poster">URL do pôster</label>
                        <input id="poster" name="poster" type="url">
                    </div>

                    <div class="campo">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="assistido">Assistido</option>
                            <option value="assistindo">Assistindo</option>
                            <option value="quero">Quero assistir</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nota">Nota (1 a 5)</label>
                        <input id="nota" name="nota" type="number" min="1" max="5" step="1">
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentário</label>
                        <textarea id="comentario" name="comentario"></textarea>
                    </div>

                    <div class="acoes-formulario">
                        <button type="button" id="btn-cancelar">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

    <script src="app.js"></script>
    </body>
</html>
